<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="supported-color-schemes" content="light" />
    <title>Notigram</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      })();
    </script>

    <style>
      :root {
        color-scheme: only light !important;
        --tg-safe-top: 0px;
        --tg-safe-bottom: 0px;
        --tg-content-top: 0px;
        --tg-content-bottom: 0px;
        --keyboard-inset: 0px;
      }
      html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: #FAF8F5 !important;
        color: #24201D !important;
        color-scheme: only light !important;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        background-color: #FAF8F5 !important;
      }
      .app-container {
        width: 100%;
        max-width: 420px;
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: #FAF8F5 !important;
        overflow: hidden;
      }
      .scroll-container {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
      .scroll-container::-webkit-scrollbar {
        display: none;
      }
      .safe-header-box {
        padding-top: calc(max(var(--tg-content-top, 0px), var(--tg-safe-top, 0px), env(safe-area-inset-top, 0px)) + 14px);
      }
      .safe-bottom-space {
        padding-bottom: calc(max(var(--tg-content-bottom, 0px), var(--tg-safe-bottom, 0px), env(safe-area-inset-bottom, 0px)) + 5.5rem);
      }
      button, nav, header, .no-select {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .physics-bounce {
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.12s ease;
        will-change: transform;
        transform: translate3d(0, 0, 0);
      }
      .physics-bounce:active {
        transform: translate3d(0, 0, 0) scale(0.95);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
